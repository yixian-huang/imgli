name: dco

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: dco-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - name: Skip bot PRs
        if: github.actor == 'dependabot[bot]' || github.actor == 'github-actions[bot]'
        run: echo "skip DCO for ${{ github.actor }}"

      - uses: actions/checkout@v5
        if: github.actor != 'dependabot[bot]' && github.actor != 'github-actions[bot]'
        with:
          fetch-depth: 0

      - name: Require Signed-off-by on each commit
        if: github.actor != 'dependabot[bot]' && github.actor != 'github-actions[bot]'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          while read -r c; do
            [ -n "$c" ] || continue
            body=$(git log -1 --format='%B' "$c")
            if ! printf '%s\n' "$body" | grep -qE '^Signed-off-by: .+ <[^@]+@[^>]+>$'; then
              echo "DCO missing on $c"
              git log -1 --format='%h %an <%ae>%n%s' "$c"
              missing=1
            fi
          done < <(git rev-list --no-merges "${BASE}..${HEAD}")
          if [ "$missing" -ne 0 ]; then
            echo "::error::Every commit needs a Signed-off-by trailer (git commit -s). See CONTRIBUTING.md."
            exit 1
          fi
          echo "DCO ok"
